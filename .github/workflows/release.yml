name: Build and release Noxy

on:
  push:
    branches: [main]
    paths:
      - "version.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content version.json | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid release version: $version" }
          "value=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Prepare release notes
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.value }}"
          $lines = Get-Content CHANGELOG.md
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^## \[$([regex]::Escape($version))\](?:\s|$)") { $start = $i; break }
          }
          if ($start -lt 0) { throw "CHANGELOG.md has no section for $version" }
          $end = $lines.Count
          for ($i = $start + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^## \[') { $end = $i; break }
          }
          $notes = $lines[$start..($end - 1)] -join "`n"
          if ([string]::IsNullOrWhiteSpace($notes)) { throw "Release notes for $version are empty" }
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8

      - name: Publish self-contained Windows app
        run: dotnet publish Noxy.csproj -c Release -r win-x64 --self-contained true -p:Version=${{ steps.version.outputs.value }} -p:AssemblyVersion=${{ steps.version.outputs.value }}.0 -p:FileVersion=${{ steps.version.outputs.value }}.0 -p:InformationalVersion=${{ steps.version.outputs.value }} -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableWindowsTargeting=true -o publish

      - name: Package app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-package | Out-Null
          Copy-Item publish/Noxy.exe release-package/Noxy.exe
          Compress-Archive -Path release-package/* -DestinationPath Noxy-win-x64.zip
          $hash = (Get-FileHash Noxy-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path Noxy-win-x64.zip.sha256 -Value $hash -NoNewline

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.value }}"
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler not found: $compiler" }
          & $compiler "/DMyAppVersion=$version" setup.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          $installer = "installer-output\Noxy-Setup-x64.exe"
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "$installer.sha256" -Value $hash -NoNewline

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists. Increase version.json before releasing." }
          gh release create $tag Noxy-win-x64.zip Noxy-win-x64.zip.sha256 installer-output/Noxy-Setup-x64.exe installer-output/Noxy-Setup-x64.exe.sha256 --title "Noxy ${{ steps.version.outputs.value }}" --notes-file release-notes.md

